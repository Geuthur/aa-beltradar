{% load django_bootstrap5 %}
{% load i18n %}

<!-- accept delete snapshot modal -->
<div class="modal fade" id="beltradar-accept-delete-snapshot" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title fs-5">
                    {% translate "Accept Delete Snapshot" %}
                </div>

                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="{% translate 'Close' %}"></button>
            </div>

            <div class="modal-body">
                <p>
                    {% translate "Are you sure you want to delete this snapshot?" %}
                </p>

                <form method="post">
                    {% csrf_token %}

                    {% bootstrap_form forms.delete_snapshot %}
                </form>
            </div>

            <div class="modal-footer">
                <button id="modal-button-cancel-accept-request" type="button" class="btn btn-danger btn-sm" data-bs-dismiss="modal">
                    <i class="fa-solid fa-hand"></i>
                    {% translate "Cancel" %}
                </button>

                <button id="modal-button-confirm-accept-request" type="button" class="btn btn-success btn-sm">
                    <i class="fa-solid fa-check"></i>
                    {% translate "Accept Delete Snapshot" %}
                </button>
            </div>
        </div>
    </div>
</div>
get_survey_delete_button
