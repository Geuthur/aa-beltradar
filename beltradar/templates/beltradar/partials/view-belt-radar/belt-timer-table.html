{% load i18n %}
<div class="card mt-2 rounded">
    <div class="card-header bg-primary rounded-top d-flex flex-wrap align-items-center justify-content-between gap-2 mb-2">
        <h3 class="me-3">{% translate "Respawn Timers" %}</h3>
        <span class="text-muted">{{ add_belt_timer_button|safe }}</span>
    </div>
    <!-- Belt Radar Sessions Table -->
    <div class="card-body table-responsive mb-3">
        <table class="table table-striped table-hover w-100" id="beltradar-belt-timer-table">
            <thead>
                <tr>
                    <th class="w-auto">{% translate "Public ID" %}</th>
                    <th class="w-auto">{% translate "Belt ID" %}</th>
                    <th class="w-auto">{% translate "Belt Name" %}</th>
                    <th class="w-auto">{% translate "Belt Size" %}</th>
                    <th class="w-auto">{% translate "Belt Type" %}</th>
                    <th class="w-auto">{% translate "ETA" %}</th>
                    <th class="w-auto">{% translate "Actions" %}</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td colspan="7" class="text-center" id="loading-message-container">
                        <div class="spinner-border text-primary">
                            <span class="visually-hidden">{% translate "Loading..." %}</span>
                        </div>
                    </td>
                </tr>
            </tbody>
            <tfoot></tfoot>
        </table>
    </div>
</div>
