{% load i18n %}
<div class="card mt-2 rounded">
    <div class="card-header bg-primary rounded-top">
        <h3 class="me-3">{% translate "Sessions" %}</h3>
    </div>
    <!-- Belt Radar Sessions Table -->
    <div class="table-responsive mb-3">
        <table class="table table-striped table-hover w-100" id="beltradar-session-table">
            <thead>
                <tr>
                    <th class="w-auto">{% translate "Public ID" %}</th>
                    <th class="w-auto">{% translate "Name" %}</th>
                    <th class="w-auto">{% translate "Created At" %}</th>
                    <th class="w-auto">{% translate "Owner" %}</th>
                    <th class="w-auto">{% translate "Actions" %}</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td colspan="5" class="text-center" id="loading-message-container">
                        <div class="spinner-border text-primary">
                            <span class="visually-hidden">{% translate "Loading..." %}</span>
                        </div>
                    </td>
                </tr>
            </tbody>
            <tfoot></tfoot>
        </table>
    </div>
</div>
