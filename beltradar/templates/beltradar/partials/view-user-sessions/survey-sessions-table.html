{% load i18n %}
{% load evelinks %}
{% load humanize %}
<div class="card card-body mt-2 rounded">
    <!-- Belt Radar Sessions Table -->
    <div class="table-responsive mb-3">
        <table class="table table-striped table-hover w-100" id="beltradar-sessions-table">
            <thead>
                <tr>
                    <th class="w-auto">{% translate "Public ID" %}</th>
                    <th class="w-auto">{% translate "Name" %}</th>
                    <th class="w-auto">{% translate "Created At" %}</th>
                    <th class="w-auto">{% translate "Owner" %}</th>
                    <th class="w-auto">{% translate "Actions" %}</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td colspan="5" class="text-center" id="loading-message-container">
                        <div class="spinner-border text-primary">
                            <span class="visually-hidden">{% translate "Loading..." %}</span>
                        </div>
                    </td>
                </tr>
            </tbody>
            <tfoot></tfoot>
        </table>
    </div>
</div>

<script>
    $(document).ready(function() {
        const BeltRadarSessionsTable = $('#beltradar-sessions-table');

        /**
        * DataTable for Belt Radar Session
        * Initialized empty and filled after async fetch.
        */
        const BeltRadarSessionsDataTable = new DataTable(BeltRadarSessionsTable, {
            data: [],
            language: aaBeltRadarSettings.dataTables.language,
            layout: aaBeltRadarSettings.dataTables.layout,
            ordering: aaBeltRadarSettings.dataTables.ordering,
            columnControl: aaBeltRadarSettings.dataTables.columnControl,
            order: [[2, 'desc']],
            columnDefs: [
                {
                    orderable: false,
                    targets:  [3,4],
                    columnControl: [
                        {target: 0, content: []},
                        {target: 1, content: []}
                    ]
                },
            ],
            columns: [
                {
                    data: {
                        display: (data) => data.public_id,
                        sort: (data) => data.public_id,
                        filter: (data) => data.public_id,
                    }
                },
                {
                    data: {
                        display: (data) => data.name,
                        sort: (data) => data.name,
                        filter: (data) => data.name,
                    }
                },
                {
                    data: {
                        display: (data) => `${data.created_at}`,
                        sort: (data) => data.created_at,
                        filter: (data) => data.created_at,
                    }
                },
                {
                    data: {
                        display: (data) => data.owner,
                        sort: (data) => data.owner,
                        filter: (data) => data.owner,
                    }
                },
                {
                    data: {
                        display: (data) => data.html,
                        sort: (data) => data.created_at,
                        filter: (data) => data.created_at,
                    }
                },
            ],
            initComplete: function() {
                _bootstrapTooltip({selector: '#beltradar-sessions-table'});
            },
            drawCallback: function () {
                _bootstrapTooltip({selector: '#beltradar-sessions-table'});
            },
        });

        fetchGet({
            url: aaBeltRadarSettings.url.userSessions,
        })
        .then((data) => {
             BeltRadarSessionsDataTable.clear().rows.add(data).draw();
        })
        .catch((error) => {
            console.error('Error fetching User Sessions DataTable:', error);
            BeltRadarSessionsDataTable.clear().draw();
        });
    });
</script>
